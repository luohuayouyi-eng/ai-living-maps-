services:
  - type: web
    name: ai-living-maps
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATABASE_URL
        fromDatabase:
          name: ai-maps-db
          property: connectionString

databases:
  - name: ai-maps-db
    databaseName: ai_maps
    plan: free
